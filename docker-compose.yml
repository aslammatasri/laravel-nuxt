services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: affiliatemy-backend
    env_file: .env
    environment:
      DB_HOST: db
    volumes:
      - storage_data:/app/storage/app/public
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Runs Laravel's scheduled tasks (routes/console.php), e.g. products:close-expired
  scheduler:
    image: affiliatemy-backend
    command: php artisan schedule:work
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_BASE: /api
        NUXT_PUBLIC_STORAGE_BASE: /storage
        NUXT_PUBLIC_GOOGLE_CLIENT_ID: ${NUXT_PUBLIC_GOOGLE_CLIENT_ID}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  db_data:
  storage_data:
